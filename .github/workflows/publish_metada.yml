name: Publish Metadata to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
     contents: write
     pages: write
     pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install markdown pyaml pillow requests

      - name: Extract Metadata
        run: |
          mkdir -p output
          python .github/extract_metadata.py "https://EOPF-Explorer.github.io/narratives/"
          cp *.md output
          touch output/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: ./output
          branch: gh-pages
          clean-exclude: pr-preview
          force: false